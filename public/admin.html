<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Espacio Seed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --color-sage: #5b6c5c;
      --color-sage-dark: #435244;
      --color-beige: #cbbba0;
      --color-beige-light: #f3ece2;
      --color-dark: #121614;
      --color-cream: #faf9f6;
      --color-white: #ffffff;

      --font-heading: 'Cormorant Garamond', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--color-cream);
      color: var(--color-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--color-white);
      border-bottom: 1px solid rgba(91, 108, 92, 0.15);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--color-dark);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge-admin {
      background-color: var(--color-beige);
      color: var(--color-dark);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      max-width: 1200px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-header h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--color-dark);
    }

    .stats-card {
      background-color: var(--color-white);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      border: 1px solid rgba(91, 108, 92, 0.15);
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .stats-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: rgba(91, 108, 92, 0.12);
      color: var(--color-sage);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats-info div {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stats-info span {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-dark);
    }

    /* Buscador */
    .search-box {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3rem;
      border: 1px solid rgba(91, 108, 92, 0.2);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      background-color: var(--color-white);
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .search-input:focus {
      border-color: var(--color-sage);
      box-shadow: 0 0 0 3px rgba(91, 108, 92, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }

    /* Tabla */
    .table-container {
      background-color: var(--color-white);
      border-radius: 20px;
      border: 1px solid rgba(91, 108, 92, 0.12);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--color-cream);
      padding: 1rem 1.25rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-sage-dark);
      border-bottom: 1px solid rgba(91, 108, 92, 0.1);
    }

    td {
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(91, 108, 92, 0.08);
      color: #333;
    }

    tr:hover td {
      background-color: rgba(91, 108, 92, 0.03);
    }

    .client-name {
      font-weight: 600;
      color: var(--color-dark);
    }

    .client-email {
      color: #666;
      font-size: 0.85rem;
    }

    .tag-gender {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
      background-color: rgba(91, 108, 92, 0.1);
      color: var(--color-sage-dark);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #777;
      font-size: 0.85rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand-logo">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 C25 25 15 50 50 95 C85 50 75 25 50 5 Z" stroke="#5b6c5c" stroke-width="4" fill="none"/>
        <path d="M50 25 C38 40 42 60 50 75 C58 60 62 40 50 25 Z" fill="#5b6c5c" opacity="0.85"/>
      </svg>
      <span class="brand-title">Espacio Seed</span>
    </a>
    <span class="badge-admin">Panel de Administración</span>
  </header>

  <main>
    <div class="admin-header">
      <div>
        <h1>Base de Datos de Clientes</h1>
        <p style="color: #666; font-size: 0.95rem;">Gestión e inspección de clientes registrados en Espacio Seed.</p>
      </div>

      <div class="stats-card">
        <div class="stats-icon">
          <i data-lucide="users" style="width:22px; height:22px;"></i>
        </div>
        <div class="stats-info">
          <div>Total Clientes</div>
          <span id="total-count">0</span>
        </div>
      </div>
    </div>

    <!-- Buscador -->
    <div class="search-box">
      <i data-lucide="search" class="search-icon" style="width:20px; height:20px;"></i>
      <input type="text" id="search" class="search-input" placeholder="Buscar por Nombre, DNI, Email o Teléfono...">
    </div>

    <!-- Tabla de Clientes -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>DNI</th>
            <th>Edad / Género</th>
            <th>Nacimiento</th>
            <th>Fecha Alta</th>
          </tr>
        </thead>
        <tbody id="clients-tbody">
          <tr>
            <td colspan="6" style="text-align: center; padding: 2rem; color: #777;">
              Cargando clientes de la base de datos...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    Espacio Seed &copy; 2026 — Base de Datos Cloudflare D1
  </footer>

  <script>
    let searchTimeout = null;

    async function fetchClients(query = '') {
      const tbody = document.getElementById('clients-tbody');
      const totalCount = document.getElementById('total-count');

      try {
        const res = await fetch(`/api/clients?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        totalCount.innerText = data.total || 0;

        if (!data.clients || data.clients.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 2.5rem; color: #888;">
                No se encontraron clientes que coincidan con la búsqueda.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = data.clients.map(c => `
          <tr>
            <td>
              <div class="client-name">${c.name || 'Sin Nombre'}</div>
              <div class="client-email">${c.email || '-'}</div>
            </td>
            <td>${c.phone || '-'}</td>
            <td>${c.dni || '-'}</td>
            <td>
              ${c.age ? `<b>${c.age} años</b>` : '-'}
              ${c.gender ? `<div><span class="tag-gender">${c.gender}</span></div>` : ''}
            </td>
            <td>${c.birthdate || '-'}</td>
            <td><small style="color:#777;">${c.createdAt || '-'}</small></td>
          </tr>
        `).join('');

        lucide.createIcons();
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: 2rem; color: #b91c1c;">
              Error al conectar con la API de clientes.
            </td>
          </tr>
        `;
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchClients(e.target.value);
      }, 250);
    });

    fetchClients();
  </script>
</body>
</html>
